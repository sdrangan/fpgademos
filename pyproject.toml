[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwdesign"
version = "0.1.0"
description = "Course-specific helpers for the Introduction to Hardware Design course, built on top of waveflow"
readme = {file = "readme.md", content-type = "text/markdown"}
# Must stay >= waveflow's own floor (currently >=3.10). Declaring anything lower
# is a lie: hwdesign cannot function without waveflow, so an older interpreter
# fails at dependency resolution instead of here, with a confusing error.
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Sundeep Rangan", email = "srangan@nyu.edu"},
]
keywords = ["fpga", "vivado", "vitis", "hardware", "education", "waveflow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]
# hwdesign is a thin course-specific layer ON TOP OF waveflow. waveflow itself is
# installed editable from ../pysilicon during development (see requirements-dev.txt);
# this declaration is satisfied by that editable install. Pin to a release
# (waveflow==X.Y.Z) when the course runs (~Sept 2026).
dependencies = [
  "waveflow",

  # The course material is delivered as notebooks (30 tracked .ipynb files), so
  # the notebook toolchain is a genuine course requirement rather than a
  # developer convenience. waveflow correctly does not depend on Jupyter -- it
  # is a library -- so this belongs here.
  "jupyterlab>=4.0",
  "ipykernel>=6.0",

  # Was a stopgap for waveflow importing matplotlib without declaring it; that
  # was fixed upstream on 2026-08-10 (waveflow commit a95edfb, "fix(deps):
  # declare matplotlib and vcdvcd"). It stays here on its own merits: the demos
  # plot directly (demos/datatypes/datatypes_build.py), so this is now a genuine
  # first-party dependency rather than someone else's omission.
  #
  # waveflow also imports scipy without declaring it, but scipy arrives
  # transitively via scikit-learn, so it is not listed here. That is luck
  # rather than design and should still be fixed upstream.
  "matplotlib>=3.7",

  # Test vectors are exchanged with SystemVerilog as CSV, written and read with
  # pandas (demos/datatypes, labs/cubic). This was previously undeclared and
  # happened to be present in the course venv -- a fresh install would have
  # failed on `import pandas` in labs/cubic/run_tests.py.
  "pandas>=2.0",
]

[tool.setuptools]
include-package-data = true

# Flat layout: the package lives at ./hwdesign/. The explicit include filter keeps
# setuptools from treating the non-package top-level dirs (units, demos, labs, docs,
# gradescope, extra) as packages.
[tool.setuptools.packages.find]
where = ["."]
include = ["hwdesign*"]

# Console scripts: the old pysilicon entry points are intentionally dropped during
# the migration. Re-add only genuinely course-specific scripts here as units are
# integrated; general tooling now lives in waveflow (waveflow.scripts.*).

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
# The suite is tiered by what it needs to run. Tiers 0 and 1 are pure Python and
# run anywhere in a couple of seconds; they are the canary for waveflow API drift,
# which matters because waveflow is installed editable from a clone that is
# actively developed -- the demos can break without this repo changing at all.
# Tier 2 drives Vivado and is skipped when xvlog is not on PATH.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "vivado: requires a Vivado installation (runs xvlog/xelab/xsim; slow)",
    "slow: takes minutes rather than seconds (e.g. the exhaustive 65k-row sweep)",
]
