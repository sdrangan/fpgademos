[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwdesign"
version = "0.1.0"
description = "Course-specific helpers for the Introduction to Hardware Design course, built on top of waveflow"
readme = {file = "readme.md", content-type = "text/markdown"}
# Must stay >= waveflow's own floor (currently >=3.10). Declaring anything lower
# is a lie: hwdesign cannot function without waveflow, so an older interpreter
# fails at dependency resolution instead of here, with a confusing error.
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Sundeep Rangan", email = "srangan@nyu.edu"},
]
keywords = ["fpga", "vivado", "vitis", "hardware", "education", "waveflow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]
# hwdesign is a thin course-specific layer ON TOP OF waveflow. waveflow itself is
# installed editable from ../pysilicon during development (see requirements-dev.txt);
# this declaration is satisfied by that editable install. Pin to a release
# (waveflow==X.Y.Z) when the course runs (~Sept 2026).
dependencies = [
  "waveflow",

  # The course material is delivered as notebooks (30 tracked .ipynb files), so
  # the notebook toolchain is a genuine course requirement rather than a
  # developer convenience. waveflow correctly does not depend on Jupyter -- it
  # is a library -- so this belongs here.
  "jupyterlab>=4.0",
  "ipykernel>=6.0",

  # STOPGAP -- remove once waveflow declares it upstream.
  # waveflow imports matplotlib (waveflow/utils/timing.py, utils/vcd.py,
  # calib/calib.py) but omits it from its own dependencies. Verified against a
  # clean install from GitHub on 2026-08-05: "from waveflow.utils.timing import
  # TimingDiagram" raises ModuleNotFoundError: No module named 'matplotlib'.
  # Declaring it here unblocks the course; the real fix is upstream, since
  # anyone installing waveflow alone still hits it.
  #
  # waveflow also imports scipy without declaring it, but scipy arrives
  # transitively via scikit-learn, so it is not listed here. That is luck
  # rather than design and should still be fixed upstream.
  "matplotlib>=3.7",
]

[tool.setuptools]
include-package-data = true

# Flat layout: the package lives at ./hwdesign/. The explicit include filter keeps
# setuptools from treating the non-package top-level dirs (units, demos, labs, docs,
# gradescope, extra) as packages.
[tool.setuptools.packages.find]
where = ["."]
include = ["hwdesign*"]

# Console scripts: the old pysilicon entry points are intentionally dropped during
# the migration. Re-add only genuinely course-specific scripts here as units are
# integrated; general tooling now lives in waveflow (waveflow.scripts.*).
